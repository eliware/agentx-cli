name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - run: npm ci
      - name: Validate package version
        run: test "$(node -p \"require('./package.json').version\")" = "${GITHUB_REF_NAME#v}"
      - run: npm run pack
      - name: Publish to npm
        run: npm publish --access public --provenance
      - name: Verify package publication
        run: test "$(npm view "$(node -p \"require('./package.json').name\")" version)" = "${GITHUB_REF_NAME#v}"

name: Publish

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
      - name: Validate release tag and package version
        run: '[[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && test "$(npm pkg get version --raw)" = "${GITHUB_REF_NAME#v}"'
      - run: npm ci
      - run: npm run pack
      - name: Publish to npm
        run: npm publish --access public --provenance
      - name: Verify package publication
        run: test "$(npm view "$(node -p \"require('./package.json').name\")" version)" = "${GITHUB_REF_NAME#v}"

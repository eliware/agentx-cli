title: "Responses and tool execution"
body: |
  Worker processes must be terminated when the parent AgentX process exits. Shutdown sends SIGTERM first, waits a bounded grace period, then sends SIGKILL if the child is still alive. The same escalation applies to worker timeouts and cancellations. Completed workers remain queryable; active workers are terminated during shutdown. Preserve `timed_out` or `cancelled` as the terminal reason when already set.

  Worker process lifecycle owns child event handling, timeout escalation, finalization callbacks, and parent-shutdown termination. `worker-log-stream.mjs` owns child output buffering, redaction, and log persistence. `worker-log-aggregation.mjs` owns output line counts and usage aggregation. Worker command orchestration owns spawn/status/cancellation requests and persistent-record recovery, coordinating with the process lifecycle. Worker snapshot formatting and terminal-state/wait policies belong to the focused worker-status module; bounded/searchable output selection belongs to worker-output; usage parsing and once-only forwarding belong to worker-usage. Process lifecycle, log streaming, command orchestration, and pure status/output/usage policies each have focused mirrored tests; cross-module recovery and command-to-process behavior remain integration tests. Generate unique AgentX IDs with the Snowflake generator from `@eliware/common`.

  Worker process request/environment construction belongs to `image-worker-request.mjs`; child stream lifecycle and result handling belong to `image-worker-process.mjs`. Worker record serialization and log storage belong to separate focused modules with mirrored tests. The process coordinator owns worker creation, process registration, and shutdown requests.

  Worker state paths, record storage, log storage, record indexing, and record retention belong to separate focused modules with mirrored tests. `worker-record-storage.mjs` coordinates record reads and writes; `worker-record-writer.mjs` owns atomic writes and `worker-record-reader.mjs` owns current and legacy reads. The worker registry coordinates these operations.

  `worker-usage.mjs` parses and aggregates usage from worker logs. `worker-usage-forwarding.mjs` reports each worker aggregate once. The child lifecycle coordinates both boundaries.

  `parallel-worker-command-coordinator.mjs` owns worker call validation, recovery ordering, and spawn/status/cancel routing. This is one worker-command workflow. The coordinator does not expose process lifecycle or launch-argument helpers. Argument parsing, recovery policy, recovery dependency wiring, process-liveness recovery, spawn, cancellation target selection, live and recovered cancellation, and status handling belong to focused modules with mirrored tests. Shared worker ID filtering belongs to `parallel-worker-arguments.mjs`. `parallel-worker-cancel.mjs` coordinates each cancel request and result; `parallel-worker-cancel-selection.mjs` resolves active and persisted targets and builds their result snapshots. `worker-environment.mjs` builds the allowlisted child environment; `worker-launch-arguments.mjs` builds child arguments. `worker-process.mjs` owns worker creation and lifecycle attachment. Its mirrored test covers process behavior. The recovery coordinator wires worker storage and process state into recovery. Agent runtime composition delegates prompt input, command dispatch, session persistence, recovery, tool execution, and shutdown to focused modules. Shell execution delegates output capture, termination, launcher selection, and process completion to focused modules with mirrored tests.

  Worker permission levels are enforced by the harness: `read` permits recognized read-only commands, `write` permits recognized read/write commands but not arbitrary execution, and `execute` permits normal shell execution. Unknown commands and shell redirection require `execute` or `write` as appropriate; permission checks happen before shell execution. These classifications are advisory controls, not a security sandbox: shell wrappers, aliases, scripts, command substitutions, and encoded commands may bypass name-based classification. Use `--confirm` for human review and do not treat AgentX as a strong isolation boundary. Tool confirmation is opt-in for high-confidence destructive commands only: without `--confirm`, approval is automatic, including in one-shot and noninteractive mode. With `--confirm`, destructive commands are prompted interactively or declined when no confirmer is available; routine administrative and DevOps commands must not be blocked solely by this confirmation policy.

  `agent/session-retry-state.mjs` builds and persists retry transaction state. `agent/session-request-lifecycle.mjs` owns goal-interrupt listener setup, cleanup, and goal REPL refresh around each request attempt. The request cycle composes these helpers and owns retry ordering. Each helper has a mirrored test; request cycle and pending executor tests retain integration coverage.
  `agent/session-request-cycle.mjs` owns request attempt ordering, retry control, and lifecycle composition. `agent/session-request-cycle-services.mjs` supplies default collaborators and merges caller overrides. Keep the request cycle integration tests with its coordinator and test service selection in the mirrored service test. `agent/session-usage-accounting.mjs` builds response and worker usage callbacks for normal and resumed requests; both coordinators use the shared helper and its mirrored test.

  `agent/session-recovery-accessors.mjs` owns mutable recovery accessors. `agent/session-recovery-state.mjs` owns recovery state transitions, including clearing pending continuation state for a new chain. `agent/session-request-recovery.mjs` coordinates recovery actions and menu handling. `agent/session-pending-choice.mjs` maps resume choices to coordinator actions and notices; `agent/session-pending-recovery.mjs` owns menu, resume, and outcome ordering. `agent/session-goal-command-handler.mjs` applies goal command transitions and side effects; `agent/session-command-router.mjs` owns command routing. Each helper has a mirrored suite; command and recovery suites retain integration coverage.

  `agent/session-user-turn-state.mjs` owns the state reset that prepares a new user turn. `agent/session-user-turn.mjs` owns request and finalization ordering. Its integration suite verifies sequencing; the transition suite verifies state changes.

  `agent/conversation-transitions.mjs` owns response snapshot and successful-turn history transitions. Test those transitions in `tests/agent/conversation-transitions.test.mjs`. `agent/session-state-reset-transition.mjs` owns full session reset state. `agent/session-turn-finalization.mjs` owns persistence ordering and one-shot cleanup. `agent-turn/tool-loop-policy.mjs` owns active status registration and goal cancellation cleanup; `agent-turn/tool-loop.mjs` owns cycle ordering and retains integration tests.

  `agent-turn/goal-tool-classifier.mjs` recognizes goal function calls. `agent-turn/goal-call-parser.mjs` parses and validates goal arguments; `agent-turn/goal-outcome-policy.mjs` maps validated goal methods to outcomes. `agent-turn/goal-tool-handler.mjs` applies those outcomes and performs status and callback effects. Keep focused tests beside each policy module and retain execution integration tests with tool execution and the loop. `agent/pending-session-abandonment-transition.mjs` restores state from a saved checkpoint; `agent/pending-session-abandonment.mjs` owns abandonment persistence and fresh-session clearing. Prompt-error classification stays in `agent/session-prompt-errors.mjs`; active-goal cancellation state updates belong in `agent/session-goal-interruption.mjs`.

  Shell command classification belongs to `tool-command-classification.mjs`; permission-level checks belong to `permission-policy.mjs`; command confirmation rules belong to `tool-confirmation-rules.mjs`. Each policy has mirrored tests. Call identity/deduplication is a separate tool policy. Tool-call approval and single-call execution use focused helpers with mirrored tests. Conversion of call results to Responses API tool-output shapes belongs to a focused tool-output adapter with mirrored tests, separate from the existing maximum-output/truncation policy. The tool-call runner consumes these helpers; tool dispatch retains tests only for call routing and execution integration.

  `response-service.mjs` owns request and tool-loop coordination. Request selection and override merging belong to `request-builder.mjs`. Stream controller setup, stream options, and request submission belong to `response-stream-request.mjs`; stream events and cleanup belong to `response-stream.mjs`. Mirrored tests cover each boundary; response-service tests cover collaborator wiring and end-to-end request flow.

  `parallel-worker-cancel.mjs` owns cancel requests and result selection. `parallel-worker-process-cancel.mjs` owns SIGTERM signalling and recovered-process state updates. Its mirrored tests cover signal outcomes; worker recovery and race tests cover integration.

  The session tool loop owns response sequencing and pending-response identity. Building and submitting ordinary tool-result continuation requests belong to a focused tool-continuation module with mirrored tests; the loop supplies deduplicated tool outputs and current goal state, and the module preserves prompt request fields, records retry state before rethrowing continuation failures, and reports the continuation result. Response usage extraction, cumulative-accounting callback invocation, and per-turn/cumulative terminal reporting belong to a focused tool-loop usage module with mirrored tests; loop tests cover only sequencing and response progression. Autonomous goal iteration limits and goal-decision continuation requests belong to a focused goal-continuation module with mirrored tests; the loop retains cancellation checks and response ordering. Sequential tool confirmation/execution, callback lifecycle, and tool-output collection belong to a focused tool-call runner with mirrored tests. The loop supplies current-response context and consumes the runner's outputs; goal-tool parsing, validation, and lifecycle transitions remain owned by the goal-tools module.

  Live response event and tool-item classification belong to `response-event-types.mjs`. `response-format.mjs` dispatches transcript formatting; message/reasoning and tool-item formatting belong to separate focused modules with mirrored tests. Response-item completion uses both boundaries.

  Status phase accounting and terminal-line rendering belong to focused modules with mirrored tests. The status controller coordinates phase changes, timers, pauses, and cleanup.

  `response-stream.mjs` owns the API stream lifecycle. Raw debug-event logging belongs to `response-debug-events.mjs`; terminal flushing and reset behavior belong to `response-stream-finalization.mjs`. Image file validation and loading belong to `image-file-input.mjs`; JPEG conversion and data URL encoding belong to `image-input.mjs`. Shell process signaling belongs to `shell-termination.mjs`; exit outcome normalization belongs to `shell-termination-outcome.mjs`. Each focused module has a mirrored test, while coordinator tests verify wiring and lifecycle.

  Session request recovery delegates WebSocket retry timing and state updates to `session-websocket-recovery.mjs`. `session-recovery-actions.mjs` applies recovery actions and their state side effects. Mirrored tests cover each boundary; request-recovery tests cover decision ordering.

  Final response completion is owned by `agent-turn/tool-loop-completion.mjs`. It persists a final response snapshot when provided, reports completion usage when the caller supplies an unreported final usage record, resolves the completion-time snapshot, clears the status controller, and emits the completion line. The tool loop delegates both ordinary and goal-completion finalization to this module; mirrored tests cover its independent behavior, while tool-loop tests cover when finalization is invoked.

  Shell command timeouts and Ctrl-T interruption must send SIGTERM first, wait a bounded grace period, then send SIGKILL to the process/process group when still alive. When the user presses Ctrl-T during an active model-requested `shell_call`, terminate the running command/process group and return a completed tool result marked as incomplete/timeout. The result must include a clear user-directed interruption message instructing the agent not to retry or execute additional commands, and to stop tool execution and report the current status to the user.

  The runtime delegates interactive model-requested tool execution and Ctrl-T terminal/readline lifecycle to `agent/interactive-tool-call.mjs`. That adapter owns temporary raw mode, abort signaling, interruption output annotation, and guaranteed listener/readline cleanup. Its mirrored tests cover interactive and noninteractive execution; the runtime only wires it into the tool loop.

  ## Debug event logging

  When `--debug` is enabled, AgentX must print transport lifecycle events and raw Responses protocol events from `@eliware/openai`, and suppress live status rendering. Debug output is diagnostic only and must not change request or tool behavior. API keys and authorization headers must never be printed.

  ## Worker session context

  A spawned worker inherits the shared successful checkpoint and receives its task as a new message using the checkpoint response ID. One-shot workers suppress human-oriented session recap output while retaining the inherited conversation context. Before the worker task, they receive a concise developer instruction identifying them as delegated workers: they must complete only the assigned task, must not orchestrate or spawn agents, and must report when done.

  ## Image inspection tool

  The default tool set includes a `view_image` function available to normal AgentX sessions and delegated one-shot workers when image inspection is supported. Workers cannot use orchestration tools, but may inspect local images from their own active working directory. Its arguments are:

  - `images`: required array of 1-10 objects, each containing `path` and optional `caption`. Paths are resolved relative to the active cwd when not absolute.
  - `prompt`: required inspection instruction, maximum 10,000 characters.
  - `detail`: optional `low`, `auto`, or `high`; default `low`.

  AgentX must validate that every path is a readable regular file and reject more than 10 images. The tool may read images outside the cwd when the resolved path is explicitly supplied. Errors are returned as concise tool output for the model; they do not create a separate user prompt.

  Image inspection runs in an isolated Responses API branch from the response immediately preceding the caller’s tool-call response. AgentX must track and pass the request’s actual `previous_response_id` for the caller response; it must never use the caller response ID itself as the branch parent when that response contains the `view_image` tool call. Fall back to the supplied response ID only when no predecessor is available; for delegated workers this remains the worker chain, never the parent agent’s live response. `image-inspector.mjs` coordinates the inspection. `image-inspection-request.mjs` validates inputs and builds the initial branch request; `image-input.mjs` encodes images; the image-branch executor owns the initial Responses call, shell/image-generation continuations, and usage reporting. `image-branch-results.mjs` owns generated-image collection and final text/path assembly. The branch request contains the prompt and, sequentially, each image with its caption text immediately before that image. The branch may use local `shell`/`shell_call` execution and the built-in `image_generation` tool, but must not receive custom functions, MCP tools, orchestration tools, or `view_image` itself. Shell calls use the delegated worker permission when present and execute in the active cwd; generated images are saved as temporary PNGs and their paths are returned to the branch as tool output context. AgentX should transcode supported and unsupported local image formats to a temporary JPEG before encoding, using a cross-platform image library, with bounded dimensions and output size. The configured AgentX model is used by default; a separate vision model is optional future configuration.

  Each `view_image` call runs in a separate one-shot AgentX worker process with its own OpenAI client and WebSocket. `image-worker.mjs` owns process input and output. `image-worker-runner.mjs` owns client lifecycle, inspection execution, usage collection, and result creation. `image-worker-bridge.mjs` serializes calls that share a branch parent. `image-worker-process.mjs` spawns the worker and handles stdout/stderr decoding, exit status, and usage forwarding. Direct image-branch request construction and execution remain separate. The worker does not create a local checkpoint; it returns only inspection text, generated paths/errors, and usage. Usage is retained and added to the parent totals even when the worker returns an error or exits nonzero after making Responses requests. Usage from every response in the isolated image-inspection branch, including shell-continuation responses, is added to the parent session totals. Only the branch's text response is returned as the `view_image` tool output. Temporary converted data and branch checkpoint state are discarded after completion. The main conversation continues from its original response ID, so image bytes are not included in the main conversation chain.

  ## Image generation tool

  The default tool set includes the Responses built-in `image_generation` tool. Supported host models may generate or edit images. When a completed `image_generation_call` contains a base64 `result`, AgentX writes it as a temporary PNG, prints the absolute path to the user, and appends that path to the pending CLI transcript so the next user request tells the agent where to find it. Generated files use the system temporary directory and are not automatically deleted during the session. Partial-image streaming events are not persisted as files. If saving fails or no result is present, AgentX reports a concise error and continues without crashing.

  ## Goal state tool

  Goal mode exposes `goal_update` for autonomous lifecycle updates (`complete`, `incomplete`, or `blocked`) and a separate `goal_blocked` function for questions requiring user input. Goal tool parsing, validation, callback transitions, and local goal state are handled by a focused goal-tool module; iteration limits and goal-decision continuation requests are handled by the goal-continuation module, while the tool loop owns cancellation sequencing. Goal command parsing belongs to shell command parsing; goal-call dispatch belongs to tool dispatch; goal lifecycle tests live in the mirrored `tests/agent-turn/goal-tools.test.mjs` suite; `tests/agent-turn/tool-loop.test.mjs` covers tool-loop sequencing, including goal orchestration, callback/continuation ordering, and cancellation. Keep detailed tool execution, confirmation, worker callback, usage, continuation request, and completion assertions in their focused mirrored suites; loop tests verify collaborator ordering and response-state progression. `goal_blocked` accepts a required question and optional choices, pauses the live status updater, displays the prompt, and waits for the answer. Check goal cancellation after the answer; stop the tool loop without another Responses request when the user cancelled the goal. Unknown or malformed calls return validation output and do not advance the goal. Goal work requests require a tool call; after tool results, the next request still allows the full work-tool set and requires a tool call, explicitly tells the model not to repeat successful commands, and asks it to complete immediately when satisfied; only a response with no work tool calls prompts a final goal_update/goal_blocked decision. `complete` ends goal mode cleanly and streams the final goal response through the normal response stream exactly once; ordinary assistant responses use that same stream. `blocked` ends it as blocked; `incomplete` continues autonomous work.

  Goal-question rendering and readline input belong to `agent/goal-question.mjs`; iteration, completion, and limit callbacks belong to `agent/goal-callbacks.mjs`. Their mirrored tests cover each boundary. Runtime integration tests verify callback wiring and returned answers.

  Goal cancellation key handling, persistence, and listener cleanup belong to `agent/session-goal-interruption.mjs`; prompt terminal preparation remains in `agent/session-input.mjs`. Blocked-question callback adaptation and last-question persistence belong to `agent/goal-question-callback.mjs`; terminal rendering and readline input remain in `agent/goal-question.mjs`. Image inspection callback adaptation and its usage accounting belong to `agent/session-image-inspection.mjs`. `agent/session-pending-executor.mjs` builds the pending tool-loop call and its session callbacks; its tests cover call arguments and callback wiring. Session request callbacks compose these helpers and retain retry persistence. Response and worker usage callback accounting belongs to `agent/session-usage-accounting.mjs` for normal and resumed requests. Image tool input parsing and routing belongs to `agent-turn/tool-image-call.mjs`; tool execution retains call ordering and lifecycle reporting.

  Live response event dispatch routes normalized events to focused renderers. Assistant text rendering buffers split ANSI sequences and emits incomplete fragments at flush; reasoning-summary rendering owns summary buffering/header styling; `web-search-completion-format.mjs` owns pure completion payload formatting while the web-search renderer owns status transitions and terminal output; MCP rendering owns MCP progress and call output/status transitions; and the tool-event renderer formats streamed shell/custom-tool arguments and item completion. The response-event dispatcher owns suppression policy, routing, and streamed-text bookkeeping. Each extracted renderer has a mirrored test file, while response-event tests cover coordinator wiring and cross-renderer behavior only. Request lifecycle and stream setup are tested with their response-service and response-stream modules.

  `agent-turn/response-stream-handler-policy.mjs` selects live and debug event handlers. `response-stream.mjs` owns response submission, finalization, and cleanup. `agent-turn/status-value-format.mjs` normalizes status values; `status-format.mjs` builds elapsed and transaction summaries.
